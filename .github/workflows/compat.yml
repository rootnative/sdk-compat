name: Compat Matrix

# Answers which Expo SDK versions a @rootnative/* build actually works on.
#
# Three ways in, and the middle one is the reason this repository exists:
#
#   workflow_call     — inertia and ui call this from their own CI, so the
#                       matrix is implemented once instead of twice. A caller
#                       that uploads a `npm pack` tarball as an artifact gets a
#                       gate that runs BEFORE publishing.
#   schedule          — the important one. Nothing in our repositories changes,
#                       yet the answer does: Reanimated narrowed its own peer
#                       range and silently invalidated ours. A frozen lockfile
#                       can never see that, so this run resolves fresh.
#   workflow_dispatch — manual, for checking one package by hand.
on:
  workflow_call:
    inputs:
      package:
        description: "Package to test, e.g. @rootnative/inertia"
        required: true
        type: string
      version:
        description: "npm version or dist-tag. Ignored when tarball-artifact is set."
        required: false
        type: string
        default: latest
      tarball-artifact:
        description: >-
          Name of an artifact from the SAME workflow run holding a `npm pack`
          .tgz. Set this to gate a release candidate that is not published yet.
          The artifact can also hold the tarballs of packages that release
          with it: the cell installs every tarball, so a peer from the same
          release does not come from the registry. The range audit reads the
          tarball of `package` only.
        required: false
        type: string
        default: ""
      fresh:
        description: "Ignore fixture lockfiles and resolve newest matching versions."
        required: false
        type: boolean
        default: false
      enforce-range:
        description: >-
          Fail the caller when the declared peer range over-promises. Set false
          to report without blocking, which is how a repository adopts the check
          before its published ranges are fixed. Flip it to true once they are.
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      package:
        description: "Package to test, e.g. @rootnative/inertia"
        required: true
        type: string
      version:
        description: "npm version or dist-tag"
        required: false
        type: string
        default: latest
      fresh:
        description: "Ignore fixture lockfiles"
        required: false
        type: boolean
        default: false
  schedule:
    # Mondays 06:00 UTC. Weekly is enough: this watches the ecosystem, which
    # moves on release cadences, not on our commits.
    - cron: "0 6 * * 1"

# The token only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: compat-${{ github.ref }}-${{ inputs.package || 'scheduled' }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Build matrix
    runs-on: ubuntu-latest
    outputs:
      fixtures: ${{ steps.matrix.outputs.fixtures }}
      specs: ${{ steps.matrix.outputs.specs }}
    steps:
      # `workflow_call` makes `actions/checkout` default to the CALLER's
      # repository, not this one. A caller (inertia, ui) therefore got its own
      # tree here: no `scripts/`, no `fixtures/`, and a pnpm lockfile that made
      # setup-node auto-detect pnpm and fail before any step ran. Name the
      # repository. `job_workflow_sha` is this workflow file's own commit, so
      # the scripts always match the workflow; it is empty outside
      # `workflow_call`, where checkout then takes the default branch.
      - name: Checkout sdk-compat
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rootnative/sdk-compat
          ref: ${{ github.job_workflow_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # This job runs no install, so there is nothing to cache. Say so
          # instead of relying on the default: setup-node v5 inferred a package
          # manager from the lockfile and failed when that binary was not on
          # PATH. v6 and later infer npm only, but the default can move again.
          package-manager-cache: false

      # Fixtures come from the directory listing, so adding an SDK needs no
      # workflow edit. With no caller naming a package (the scheduled run),
      # specs fall back to every library in support.json at `latest`.
      - name: Compute matrix
        id: matrix
        run: |
          if [ -n "${{ inputs.package }}" ]; then
            node scripts/matrix.mjs \
              --package '${{ inputs.package }}' \
              --version '${{ inputs.version }}'
          else
            node scripts/matrix.mjs
          fi

  range:
    name: range · ${{ matrix.spec }}
    needs: prepare
    runs-on: ubuntu-latest
    # Reported but not blocking while a repository still has ranges to fix.
    # The findings stay visible in the log either way.
    continue-on-error: ${{ inputs.enforce-range == false }}
    strategy:
      fail-fast: false
      matrix:
        spec: ${{ fromJSON(needs.prepare.outputs.specs) }}
    steps:
      - name: Checkout sdk-compat
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rootnative/sdk-compat
          ref: ${{ github.job_workflow_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install tooling
        run: yarn install --frozen-lockfile

      - name: Download candidate tarball
        if: inputs.tarball-artifact != ''
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ inputs.tarball-artifact }}
          path: candidate

      # A declared range can over-promise without any fixture failing, because
      # every fixture pins one internally consistent SDK. This is the check that
      # catches it, and it needs no install. The artifact can hold the tarballs
      # of sibling packages, so the audit picks the one of `package` by name.
      - name: Audit declared range
        run: |
          if [ -n "${{ inputs.tarball-artifact }}" ]; then
            TGZ=""
            for FILE in "$GITHUB_WORKSPACE"/candidate/*.tgz; do
              NAME="$(tar -xzOf "$FILE" package/package.json | node -pe 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')"
              if [ "$NAME" = '${{ inputs.package }}' ]; then TGZ="$FILE"; fi
            done
            if [ -z "$TGZ" ]; then
              echo "no tarball of ${{ inputs.package }} in the artifact ${{ inputs.tarball-artifact }}"
              exit 1
            fi
            echo "auditing local candidate: $TGZ"
            node scripts/check-range.mjs "$TGZ"
          else
            node scripts/check-range.mjs '${{ matrix.spec }}'
          fi

  cell:
    name: ${{ matrix.fixture }} · ${{ matrix.spec }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      # One red cell must not hide the others — the shape of the failure across
      # SDKs is the actual result.
      fail-fast: false
      matrix:
        fixture: ${{ fromJSON(needs.prepare.outputs.fixtures) }}
        spec: ${{ fromJSON(needs.prepare.outputs.specs) }}
    steps:
      - name: Checkout sdk-compat
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rootnative/sdk-compat
          ref: ${{ github.job_workflow_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install tooling
        run: yarn install --frozen-lockfile

      - name: Download candidate tarball
        if: inputs.tarball-artifact != ''
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ inputs.tarball-artifact }}
          path: candidate

      # Drift mode. A committed lockfile makes the PR gate reproducible, which
      # is what you want when testing your own change, but it also freezes the
      # ecosystem — and upstream moving is the failure this repository exists to
      # catch. The scheduled run therefore throws the lockfile away.
      - name: Unpin fixture (drift run)
        if: inputs.fresh || github.event_name == 'schedule'
        run: rm -f fixtures/${{ matrix.fixture }}/yarn.lock

      - name: Install SDK runtime
        working-directory: fixtures/${{ matrix.fixture }}
        run: |
          if [ -f yarn.lock ]; then
            yarn install --frozen-lockfile
          else
            yarn install
          fi

      # The fixture pins the SDK runtime only. The candidate goes on top, so one
      # fixture serves every library and every version. Every tarball of the
      # artifact goes on: a package that releases with the candidate, such as
      # `core` beside `components`, then does not come from the registry, where
      # the last release can declare another SDK band.
      - name: Install candidate
        working-directory: fixtures/${{ matrix.fixture }}
        run: |
          if [ -n "${{ inputs.tarball-artifact }}" ]; then
            TARGETS=()
            for FILE in "$GITHUB_WORKSPACE"/candidate/*.tgz; do
              TARGETS+=("file:$FILE")
            done
            echo "installing local candidate: ${TARGETS[*]}"
            yarn add "${TARGETS[@]}"
          else
            yarn add '${{ matrix.spec }}'
          fi

      # yarn classic does not install peers, npm 7+ does. Without this a
      # components cell fails on peers that any real consumer would have.
      - name: Install candidate peers
        run: node scripts/install-peers.mjs '${{ matrix.fixture }}'

      # Metro bundles only what the entry graph reaches, so the fixture entry
      # has to import the package under test. Without this the bundle steps
      # would pass without ever compiling the candidate.
      - name: Point fixture entry at the candidate
        run: |
          PKG="$(node -pe 'const s=process.argv[1]; const i=s.lastIndexOf("@"); i>0?s.slice(0,i):s' '${{ matrix.spec }}')"
          node scripts/set-candidate.mjs '${{ matrix.fixture }}' "$PKG"

      # Assertion 1. Yarn classic reports peer conflicts as warnings and exits
      # 0 — it installs Reanimated 4.6.0 against react-native 0.81.5 without
      # complaint — so the installer's exit code proves nothing. This reads the
      # installed tree instead.
      - name: Assert peers
        id: peers
        run: node scripts/check-peers.mjs fixtures/${{ matrix.fixture }}

      # Assertion 2. Metro follows the `react-native` export condition, which
      # inertia points at src/.
      - name: Bundle native
        id: bundle
        working-directory: fixtures/${{ matrix.fixture }}
        run: yarn bundle

      # Assertion 3. The web export takes the `import` condition instead and is
      # the only one that loads dist/ — where the alpha.10 worklet crash lived.
      - name: Bundle web
        id: bundle-web
        working-directory: fixtures/${{ matrix.fixture }}
        run: yarn bundle:web

      # Rule 4: only a green run updates support.json, and a human writes the
      # row. Without a record the row is written from memory after the run,
      # which is how the file fell two releases behind. Each cell leaves one
      # JSON file in the shape of a `verified` entry: what it installed and what
      # each assertion returned. The row is then copied, not recalled.
      - name: Record result
        if: always()
        env:
          FIXTURE: ${{ matrix.fixture }}
          SPEC: ${{ matrix.spec }}
          TARBALL: ${{ inputs.tarball-artifact }}
          PEERS: ${{ steps.peers.outcome }}
          BUNDLE: ${{ steps.bundle.outcome }}
          BUNDLE_WEB: ${{ steps.bundle-web.outcome }}
        run: |
          node scripts/record-result.mjs \
            --fixture "$FIXTURE" --spec "$SPEC" --tarball "$TARBALL" \
            --peers "$PEERS" --bundle "$BUNDLE" --bundle-web "$BUNDLE_WEB" \
            --out results

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: compat-result-${{ matrix.fixture }}-${{ strategy.job-index }}
          path: results/*.json
          if-no-files-found: error
          retention-days: 90

      - name: Summarise
        if: always()
        run: |
          echo "| ${{ matrix.fixture }} | ${{ matrix.spec }} | ${{ job.status }} |" \
            >> "$GITHUB_STEP_SUMMARY"
